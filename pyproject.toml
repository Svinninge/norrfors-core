# File version: v0.02
# Description: Package metadata for norrfors-core, the shared library for Per's projects
# Author: Per Norrfors
# Created: 2026-09-20
# Modified: 2026-09-20 - Ship py.typed so consumers' mypy sees the annotations (Claude)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "norrfors-core"
version = "0.3.0"
description = "Shared building blocks reused across Per Norrfors' projects"
authors = [{ name = "Per Norrfors" }]
requires-python = ">=3.10"
# No runtime dependencies on purpose: this package must install unchanged on the
# NAS, on a Raspberry Pi and inside slim Docker images. Everything here is stdlib.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["norrfors_core*"]

# py.typed ships the annotations to consumers. Without it mypy skips the
# whole package in every typed project that imports it.
[tool.setuptools.package-data]
norrfors_core = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
